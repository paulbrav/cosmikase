[package]
name = "bw-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pop!_OS launcher plugin for Bitwarden vault access"

[dependencies]
plugin-common = { path = "../plugin-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secret-service = { version = "4.0", features = ["rt-async-io-crypto-rust"] }
zbus = { version = "4.4", features = ["async-io"] }
