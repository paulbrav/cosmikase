# Wallpaper fetch manifest for cosmikase themes.
#
# Lists ONLY the wallpapers with a known, byte-verifiable upstream source. Those
# files are kept out of git to keep the repo small; bin/cosmikase-wallpapers
# re-fetches them (sha256-verified) into
#   ${XDG_DATA_HOME:-~/.local/share}/cosmikase/backgrounds/<theme>/
#
# Wallpapers without a verifiable upstream source are NOT listed here — they ship
# in-tree under themes/<name>/backgrounds/, where git already owns their integrity.
# Attribution and provenance live in themes/README.md.
#
# Each record: filename + url + sha256.
themes:
