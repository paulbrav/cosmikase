# Wallpaper manifest for cosmikase themes.
#
# Records provenance + verified sha256 for every wallpaper that shipped under
# themes/*/backgrounds/. Files with a known upstream source were REMOVED from
# git; bin/cosmikase-wallpapers re-fetches them (sha256-verified) into
#   ${XDG_DATA_HOME:-~/.local/share}/cosmikase/backgrounds/<theme>/
# Files with source 'unknown' REMAIN in the repo tree (no verified re-fetch path,
# so removing them would be irreversible data loss). 'broken' files (0/near-0
# bytes, no recoverable data) were deleted outright.
#
# Provenance verified 2026-07-16 by downloading each candidate and comparing
# sha256 (bin/cosmikase-wallpapers verify re-runs the check).

# Files kept IN-TREE because their source is unknown/unverifiable:
#   - catppuccin/1-catppuccin-palette.png
