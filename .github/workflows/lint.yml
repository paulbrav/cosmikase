name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run container smoke test"
        required: false
        default: false
        type: boolean

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on install.sh
        run: shellcheck install.sh

      - name: Run ShellCheck on bin scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'
          severity: warning

      - name: Run ShellCheck on test scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './tests'
          severity: warning

  python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # The Python package was removed; only one single-file script remains.
      # ruff config lives in ruff.toml (extend-include picks up the
      # extensionless bin/cosmikase-chezmoi).
      - name: Run ruff check
        run: uvx ruff check bin/cosmikase-chezmoi

      - name: Run ruff format check
        run: uvx ruff format --check bin/cosmikase-chezmoi

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # No pyproject.toml — run pytest in uv's no-project mode with deps injected.
      - name: Run pytest
        run: uv run --with pytest,tomlkit,pyyaml pytest tests/ -x -q

  container_smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run container smoke test
        run: ENGINE=docker ./tests/container-smoke.sh

  yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -d relaxed cosmikase.yaml themes/wallpapers.yaml

  rust:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting (workspace)
        working-directory: plugins
        run: cargo fmt --all --check
      - name: Run clippy (workspace)
        working-directory: plugins
        run: cargo clippy --workspace --all-targets -- -D warnings
