name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/lint.sh is the single definition of which scripts get checked
      # and at what severity, shared with `make lint` (ubuntu-latest ships
      # shellcheck preinstalled).
      - name: Run ShellCheck (install.sh, bin/, scripts/, tests/)
        run: ./scripts/lint.sh

  python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # ruff config lives in ruff.toml: extend-include picks up the
      # extensionless bin/cosmikase-chezmoi and a bare `.` discovers the rest
      # (tests/*.py). No hardcoded file list — that is what ruff.toml is for.
      - name: Run ruff check
        run: uvx ruff check .

      - name: Run ruff format check
        run: uvx ruff format --check .

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # No pyproject.toml — run pytest in uv's no-project mode with deps injected.
      - name: Run pytest
        run: uv run --with pytest,tomlkit,pyyaml pytest tests/ -x -q

  yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -d relaxed cosmikase.yaml themes/wallpapers.yaml

  rust:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting (workspace)
        working-directory: plugins
        run: cargo fmt --all --check
      - name: Run clippy (workspace)
        working-directory: plugins
        run: cargo clippy --workspace --all-targets -- -D warnings
