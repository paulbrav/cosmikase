# cosmikase.yaml — THE manifest
# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for what gets installed. Read through the one canonical
# reader `bin/cosmikase-manifest` (python3 + PyYAML) by the chezmoi run_onchange
# scripts under chezmoi/:
#   run_onchange_before_10-packages.sh.tmpl   -> apt.*, flatpak, fonts
#   run_onchange_before_20-runtimes.sh.tmpl   -> runtimes
#   run_onchange_before_30-tools.sh.tmpl      -> cargo_tools, go_tools, uv_tools,
#                                                npm_globals, ai_tools
# Only keys that a script actually reads live here. Each list entry uses
# `install: false` to declare-but-skip. Anything omitted defaults to install.
#
# CI mode: when COSMIKASE_CI=1 the scripts install only apt.core and skip
# flatpak, runtimes, tools, fonts and GUI/snap-adjacent steps.

# ═══════════════════════════════════════════════════════════════════════════════
# APT PACKAGES
# ═══════════════════════════════════════════════════════════════════════════════
apt:
  # Core CLI — always installed, including in CI (the container smoke test checks these)
  core:
    # Shell & navigation
    - { name: zoxide }
    - { name: fzf }
    - { name: tmux }
    - { name: mosh }
    # File management
    - { name: eza }
    - { name: tree }
    - { name: fd-find }
    - { name: ncdu }
    - { name: trash-cli }
    - { name: atool }
    - { name: unzip }
    - { name: p7zip-full }
    - { name: rsync }
    - { name: pv }
    # Text & search
    - { name: ripgrep }
    - { name: bat }
    - { name: jq }
    - { name: neovim }
    # Network & transfer
    - { name: curl }
    - { name: wget }
    - { name: sshfs }
    - { name: tcpdump }
    - { name: net-tools }
    - { name: nmap }
    - { name: socat }
    # Version control
    - { name: git }
    - { name: git-lfs }
    - { name: gh }
    # Build & development
    - { name: build-essential }
    - { name: cmake }
    - { name: ninja-build }
    - { name: pkg-config }
    - { name: shellcheck }
    - { name: entr }
    - { name: direnv }
    - { name: sqlite3 }
    # Debugging & profiling
    - { name: gdb }
    - { name: valgrind }
    - { name: strace }
    - { name: lsof }
    - { name: hyperfine }
    - { name: btop }
    # Python & docs
    - { name: bpython }
    - { name: tldr }
    # Media
    - { name: ffmpeg }
    # Fonts & clipboard
    - { name: fontconfig }
    - { name: wl-clipboard }
    - { name: xclip }
    # Security & backup
    - { name: age }
    - { name: restic }
    - { name: timeshift }
    - { name: firejail }
    - { name: firejail-profiles }
    - { name: fprintd }
    - { name: libpam-fprintd }
    # Python bindings for the manifest reader itself
    - { name: python3-yaml }

  # GUI apps — skipped in CI
  gui:
    - { name: xournalpp }
    - { name: vlc }
    - { name: firefox }
    - { name: fonts-jetbrains-mono }

  # System / hardware — skipped in CI
  system:
    - { name: docker.io }
    # HP ZBook Ultra webcam verification + dictation injection (see docs/troubleshooting.md)
    - { name: v4l-utils }
    - { name: ydotool }
    # Gaming (opt-in)
    - { name: steam-installer, install: false }
    # YubiKey / FIDO2 (opt-in)
    - { name: yubikey-manager, install: false }
    - { name: libpam-u2f, install: false }
    - { name: fido2-tools, install: false }

  # PPA-sourced apt packages — installed individually from a dedicated PPA, NOT
  # as part of the core/gui/system batch above. The package script keys its PPA
  # block on membership of this list (set `install: false` to opt out).
  ppa:
    # ghostty is the quick-terminal dropdown; installed from the maintained
    # ppa:mkasberg/ghostty-ubuntu apt channel (an honest apt install, not a snap).
    # cosmic-term is the daily terminal and ships with the COSMIC desktop.
    - { name: ghostty }

# ═══════════════════════════════════════════════════════════════════════════════
# FLATPAK APPLICATIONS  (flathub remote added automatically if any are enabled)
# ═══════════════════════════════════════════════════════════════════════════════
flatpak:
  # Productivity
  - { id: md.obsidian.Obsidian }
  - { id: com.todoist.Todoist }
  - { id: org.onlyoffice.desktopeditors }
  # API development
  - { id: com.usebruno.Bruno }
  # Communication
  - { id: com.discordapp.Discord }
  - { id: org.signal.Signal }
  - { id: org.telegram.desktop }
  # Security & privacy
  - { id: com.bitwarden.desktop }
  - { id: com.protonvpn.www }
  - { id: me.proton.Mail }
  - { id: me.proton.Pass, install: false }
  # Browsers
  - { id: org.chromium.Chromium }
  - { id: com.brave.Browser, install: false }
  # Utilities
  - { id: org.localsend.localsend_app }
  - { id: com.github.tchx84.Flatseal }
  # Design (opt-in)
  - { id: org.gimp.GIMP, install: false }
  - { id: org.inkscape.Inkscape, install: false }
  # Media (opt-in)
  - { id: com.spotify.Client, install: false }

# ═══════════════════════════════════════════════════════════════════════════════
# NERD FONTS  (downloaded to ~/.local/share/fonts; skipped in CI)
# ═══════════════════════════════════════════════════════════════════════════════
fonts:
  # `check` is a filename that, if already present, means the font is installed.
  - name: JetBrainsMono
    url: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
    check: JetBrainsMonoNerdFont-Regular.ttf

# ═══════════════════════════════════════════════════════════════════════════════
# LANGUAGE RUNTIMES  (version pins; installers guarded by command -v; skipped in CI)
# ═══════════════════════════════════════════════════════════════════════════════
runtimes:
  # `install:` is omitted where the default (install) is wanted; only `zig` opts
  # out. The reader defaults a missing `install` to true (see cosmikase.yaml:10).
  rust: {}                                       # rustup official installer
  uv: {}                                         # astral.sh
  nvm: { version: "0.40.3", node: "lts" }
  bun: {}                                        # bun.sh
  go: { version: "1.24.4" }                      # tarball -> /usr/local/go
  zig: { install: false, version: "0.15.2" }     # tarball -> /opt/zig-<ver>
  julia: {}                                      # juliaup
  starship: {}                                   # -> ~/.local/bin

# ═══════════════════════════════════════════════════════════════════════════════
# LANGUAGE TOOLS  (installed by run_onchange_before_30-tools; skipped in CI)
# ═══════════════════════════════════════════════════════════════════════════════
# Rust — cargo install --locked <name>
cargo_tools:
  - { name: zellij }
  - { name: git-delta }
  - { name: sd }
  - { name: tokei }
  - { name: procs }
  - { name: cargo-sweep }        # weekly sweep timer lives in Slice 4's user units

# Go — go install <package>
go_tools:
  - { name: gum, package: "github.com/charmbracelet/gum@latest" }
  # glow: markdown renderer. NOT in Ubuntu/Pop 24.04 apt, so installed honestly
  # from Charm's Go module rather than a nonexistent apt package.
  - { name: glow, package: "github.com/charmbracelet/glow@latest" }
  - { name: lazygit, package: "github.com/jesseduffield/lazygit@latest" }
  - { name: lazydocker, package: "github.com/jesseduffield/lazydocker@latest" }
  - { name: dive, package: "github.com/wagoodman/dive@latest" }
  - { name: croc, package: "github.com/schollz/croc/v10@latest" }
  - { name: cliphist, package: "go.senan.xyz/cliphist@latest" }

# Python — uv tool install <name>
uv_tools:
  - { name: ruff }
  - { name: pyrefly }
  - { name: ty }
  - { name: jupyterlab }
  - { name: huggingface-hub }
  - { name: yt-dlp }
  - { name: marimo }

# Node — npm install -g <name>  (codex canonical here; not duplicated in ai_tools)
npm_globals:
  - { name: "@openai/codex" }
  - { name: "@earendil-works/pi-coding-agent" }
  - { name: "@mermaid-js/mermaid-cli" }
  - { name: "@bitwarden/cli" }
  - { name: "@withgraphite/graphite-cli" }

# ═══════════════════════════════════════════════════════════════════════════════
# STANDALONE-INSTALLER TOOLS  (AI CLIs + editors installed via official scripts)
# ═══════════════════════════════════════════════════════════════════════════════
# Each entry: `method` selects the installer branch in 30-tools; `check` is the
# command that, if already on PATH, means it is installed (idempotency guard).
# codex is intentionally NOT here — it is canonical in npm_globals (@openai/codex).
#   native|xai|script -> curl -fsSL <source> | bash
#       native  = Claude Code native installer
#       xai     = official xAI Grok CLI
#       script  = cursor-agent / opencode own installers
#   zed     -> curl -f <source> | sh                    (official Zed installer)
#   deb     -> download <source>, sudo apt-get install ./pkg.deb   (Cursor editor)
#   awscli  -> download+unzip <source>, sudo ./aws/install (official AWS CLI v2)
#   apt-repo-> add key_url + repo_line, apt-get install <package>  (Antigravity)
ai_tools:
  - { name: claude, method: native, source: "https://claude.ai/install.sh", check: claude }
  - { name: cursor, method: deb, source: "https://api2.cursor.sh/updates/download/golden/linux-x64-deb/cursor/latest", check: cursor }
  - { name: cursor-agent, method: script, source: "https://cursor.com/install", check: cursor-agent }
  - { name: opencode, method: script, source: "https://opencode.ai/install", check: opencode }
  - { name: grok, method: xai, source: "https://x.ai/cli/install.sh", check: grok }
  - { name: zed, method: zed, source: "https://zed.dev/install.sh", check: zed }
  - { name: awscli, method: awscli, source: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip", check: aws }
  - name: antigravity
    method: apt-repo
    check: antigravity
    key_url: "https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg"
    repo_line: "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main"
    package: antigravity

# The default theme is defined in EXACTLY ONE place: chezmoi/.chezmoi.toml.tmpl
# (promptStringOnce default = "nord"). HP ZBook Ultra G1a hardware notes (webcam,
# fingerprint, WiFi) live in docs/troubleshooting.md — no manifest key reads them.
