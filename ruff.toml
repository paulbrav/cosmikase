# Ruff configuration for cosmikase.
#
# There is no installable Python package any more — only two standalone
# PEP 723 scripts (bin/cosmikase-chezmoi and themes/render.py). This file is
# the sole home for lint/format config now that pyproject.toml is gone.

line-length = 100
target-version = "py310"

# cosmikase-chezmoi has no .py extension, so ruff would skip it during a
# directory scan (`ruff check .`, pre-commit). Include it explicitly.
extend-include = ["bin/cosmikase-chezmoi"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
